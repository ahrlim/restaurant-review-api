{% extends "layout.html" %}

{% block content %}
<section class="mx-auto" style="max-width: 480px;">
  <h1>My Account</h1>
  <div id="accountError" class="alert alert-danger d-none" role="alert"></div>

  <form id="accountForm" class="d-none">
    <div class="mb-3">
      <label for="accountUsername" class="form-label">Username</label>
      <input type="text" class="form-control" id="accountUsername" name="username"
             minlength="1" maxlength="50" autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label for="accountEmail" class="form-label">Email</label>
      <input type="email" class="form-control" id="accountEmail" name="email"
             maxlength="100" autocomplete="email" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>

  <section id="deleteAccountSection" class="d-none mt-5 pt-3 border-top">
    <h2 class="h4 text-danger">Delete Account</h2>
    <p>Deleting your account also deletes all of your reviews.</p>
    <button type="button" class="btn btn-outline-danger"
            data-bs-toggle="modal" data-bs-target="#deleteAccountModal">
      Delete Account
    </button>
  </section>
</section>

<div class="modal fade" id="deleteAccountModal" tabindex="-1"
     aria-labelledby="deleteAccountModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5 text-danger" id="deleteAccountModalLabel">Delete Account?</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Your account and all of your reviews will be permanently deleted. Are you sure?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteAccount">Delete Account</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { getCurrentUser, getToken, clearUserCache } from "/static/js/auth.js";
  import { getErrorMessage } from "/static/js/utils.js";

  const form = document.getElementById("accountForm");
  const errorBox = document.getElementById("accountError");
  const deleteButton = document.getElementById("confirmDeleteAccount");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("d-none");
  }

  function goToLogin() {
    localStorage.removeItem("access_token");
    clearUserCache();
    window.location.assign("{{ url_for('login') }}");
  }

  const user = await getCurrentUser();
  if (!user) {
    if (!getToken()) {
      goToLogin();
    } else {
      showError("Could not load your account. Please try again.");
    }
  } else {
    form.elements.username.value = user.username;
    form.elements.email.value = user.email;
    form.classList.remove("d-none");
    document.getElementById("deleteAccountSection").classList.remove("d-none");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.classList.add("d-none");
      const saveButton = form.querySelector('button[type="submit"]');
      saveButton.disabled = true;

      try {
        const token = getToken();
        if (!token) {
          goToLogin();
          return;
        }
        const response = await fetch(`/api/users/${user.id}`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        if (response.status === 401) {
          goToLogin();
          return;
        }
        if (!response.ok) throw new Error(getErrorMessage(await response.json()));

        clearUserCache();
        window.location.reload();
      } catch (error) {
        showError(error.message || "Could not update your account.");
      } finally {
        saveButton.disabled = false;
      }
    });

    deleteButton.addEventListener("click", async () => {
      errorBox.classList.add("d-none");
      deleteButton.disabled = true;

      try {
        const token = getToken();
        if (!token) {
          goToLogin();
          return;
        }
        const response = await fetch(`/api/users/${user.id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (response.status === 401) {
          goToLogin();
          return;
        }
        if (!response.ok) throw new Error(getErrorMessage(await response.json()));

        localStorage.removeItem("access_token");
        clearUserCache();
        window.location.assign("{{ url_for('home') }}");
      } catch (error) {
        bootstrap.Modal.getInstance(document.getElementById("deleteAccountModal")).hide();
        showError(error.message || "Could not delete your account.");
      } finally {
        deleteButton.disabled = false;
      }
    });
  }
</script>
{% endblock content %}
