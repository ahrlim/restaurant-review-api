{% extends "layout.html" %}

{% block content %}
<section class="mx-auto" style="max-width: 480px;">
  <h1>Login</h1>
  <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
  <form id="loginForm">
    <div class="mb-3">
      <label for="loginEmail" class="form-label">Email</label>
      <input type="email" class="form-control" id="loginEmail" name="email"
             autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label for="loginPassword" class="form-label">Password</label>
      <input type="password" class="form-control" id="loginPassword" name="password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
</section>

<script type="module">
  import { getErrorMessage } from "{{ url_for('static', path='/js/utils.js') }}";
  import { setToken } from "{{ url_for('static', path='/js/auth.js') }}";

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.classList.add("d-none");
    const submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;

    try {
      const data = new FormData(form);
      const body = new URLSearchParams({
        username: data.get("email"),
        password: data.get("password"),
      });
      const response = await fetch("/api/users/token", { method: "POST", body });
      const result = await response.json();
      if (!response.ok) throw new Error(getErrorMessage(result));

      setToken(result.access_token);
      window.location.assign("{{ url_for('home') }}");
    } catch (error) {
      errorBox.textContent = error.message || "Login failed. Please try again.";
      errorBox.classList.remove("d-none");
      submitButton.disabled = false;
    }
  });
</script>
{% endblock content %}
