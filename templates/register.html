{% extends "layout.html" %}

{% block content %}
<section class="mx-auto" style="max-width: 480px;">
  <h1>Register</h1>
  <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
  <form id="registerForm">
    <div class="mb-3">
      <label for="registerUsername" class="form-label">Username</label>
      <input type="text" class="form-control" id="registerUsername" name="username"
             autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label for="registerEmail" class="form-label">Email</label>
      <input type="email" class="form-control" id="registerEmail" name="email"
             autocomplete="email" required>
    </div>
    <div class="mb-3">
      <label for="registerPassword" class="form-label">Password</label>
      <input type="password" class="form-control" id="registerPassword" name="password"
             autocomplete="new-password" minlength="8" required>
    </div>
    <div class="mb-3">
      <label for="registerConfirmPassword" class="form-label">Confirm password</label>
      <input type="password" class="form-control" id="registerConfirmPassword"
             name="confirm_password" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="mt-3">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</section>

<script type="module">
  import { getErrorMessage } from "{{ url_for('static', path='/js/utils.js') }}";

  const form = document.getElementById("registerForm");
  const errorBox = document.getElementById("registerError");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.classList.add("d-none");
    const submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;

    try {
      const data = Object.fromEntries(new FormData(form));
      if (data.password !== data.confirm_password) {
        errorBox.textContent = "Passwords do not match.";
        errorBox.classList.remove("d-none");
        return;
      }
      delete data.confirm_password;
      const response = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!response.ok) throw new Error(getErrorMessage(await response.json()));

      window.location.assign("{{ url_for('login') }}");
    } catch (error) {
      errorBox.textContent = error.message || "Registration failed. Please try again.";
      errorBox.classList.remove("d-none");
    } finally {
      submitButton.disabled = false;
    }
  });
</script>
{% endblock content %}
