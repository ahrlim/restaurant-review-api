<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

  <style>
  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 24px;
    padding: 24px;
  }

  nav {
    grid-column: 1 / -1;
  }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Review List</a>
  </nav>

  <main>
    {% block content %}
    {% endblock content %}
  </main>

  <aside>
    <h2>Navigation</h2>
    <div class="d-flex flex-column gap-2">
      <!-- Shown when logged in (hidden by default, shown via JS) -->
      <div id="loggedInNav" class="d-none flex-column gap-2">
          <button class="btn btn-primary"
                  type="button"
                  data-bs-toggle="modal"
                  data-bs-target="#createReviewModal">Create Review</button>
          <span id="usernameDisplay" class="navbar-text"></span>
          <button class="btn btn-outline-secondary"
                  type="button"
                  id="logoutBtn">Logout</button>
      </div>
      <!-- Shown when logged out -->
      <div id="loggedOutNav" class="d-none flex-column gap-2">
          <a class="btn btn-outline-primary"
              href="{{ url_for("login") }}">Login</a>
          <a class="btn btn-primary"
              href="{{ url_for("register") }}">Register</a>
      </div>
    </div>
  </aside>

  <footer>"Where footer is."</footer>


  <!-- create New Review Modal -->
  <div class="modal fade"
    id="createReviewModal"
    tabindex="-1"
    aria-labelledby="createReviewModalLabel"
    aria-hidden="true">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="createReviewModalLabel">New Review</h5>
              <button type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"></button>
          </div>
          <form id="createReviewForm">
              <div class="modal-body">
                  <div class="mb-3">
                      <label for="title" class="form-label">Restaurant Name</label>
                      <input type="text" class="form-control" id="title" name="restaurant_name" required>
                  </div>
                  <div class="mb-3">
                      <label for="date" class="form-label">Date visited</label>
                      <input type="date" class="form-control" id="date" name="date_visited" required>
                  </div>
                  <div class="mb-3">
                      <label for="content" class="form-label">Review</label>
                      <textarea class="form-control" id="content" name="review" rows="3" required></textarea>
                  </div>
              </div>
              <div class="modal-footer">
                  <button type="button"
                          class="btn btn-outline-secondary"
                          data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Post</button>
              </div>
          </form>
      </div>
  </div>
  </div>
  <!-- Review result modals -->
  <div class="modal fade" id="successModal" tabindex="-1"
      aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-success" id="successModalLabel">Success</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="successMessage">Review saved successfully.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="errorModal" tabindex="-1"
      aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger" id="errorModalLabel">Error</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="errorMessage">Could not save the review.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
  </script>


  <!-- Auth State Management -->
  <script type="module">
  import { getCurrentUser, logout } from '/static/js/auth.js';

  // Update navbar based on auth state
  async function updateAuthUI() {
      const user = await getCurrentUser();
      const loggedInNav = document.getElementById('loggedInNav');
      const loggedOutNav = document.getElementById('loggedOutNav');

      if (user) {
      loggedInNav.classList.remove('d-none');
      loggedInNav.classList.add('d-flex');
      loggedOutNav.classList.add('d-none');
      loggedOutNav.classList.remove('d-flex');
      document.getElementById('usernameDisplay').textContent = user.email;
      } else {
      loggedInNav.classList.add('d-none');
      loggedInNav.classList.remove('d-flex');
      loggedOutNav.classList.remove('d-none');
      loggedOutNav.classList.add('d-flex');
      }
  }

  // Logout handler
  document.getElementById('logoutBtn').addEventListener('click', logout);

  // Update UI on page load
  updateAuthUI();
  </script>


  <!-- Create Review Form Handler -->
  <script type="module">
    import {
      getErrorMessage,
      showModal,
      hideModal
    } from "/static/js/utils.js";
    import { getCurrentUser } from "/static/js/auth.js";

    const createReviewForm = document.getElementById("createReviewForm");

    createReviewForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(createReviewForm);
      const reviewData = Object.fromEntries(formData.entries());

      try {
        const user = await getCurrentUser();
        if (!user) {
          window.location.assign("{{ url_for('login') }}");
          return;
        }
        reviewData.user_id = user.id;
        const response = await fetch("/api/reviews", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(reviewData)
        });
        if (response.ok) {
          document.getElementById("successMessage").textContent = "Review of " + reviewData.restaurant_name + " saved successfully.";

          createReviewForm.reset();
          document.getElementById("successModal").addEventListener(
            "hidden.bs.modal",
            () => window.location.reload(),
            { once: true },
          );
          document.getElementById("createReviewModal").addEventListener(
            "hidden.bs.modal",
            () => showModal("successModal"),
            { once: true },
          );
          hideModal("createReviewModal");
        } else {
          const error = await response.json();
          document.getElementById("errorMessage").textContent = getErrorMessage(error);
          document.getElementById("createReviewModal").addEventListener(
            "hidden.bs.modal",
            () => showModal("errorModal"),
            { once: true },
          );
          hideModal("createReviewModal");
        }
      } catch (error) {
        document.getElementById("errorMessage").textContent = error.message || "An error occurred. Please try again.";
        document.getElementById("createReviewModal").addEventListener(
          "hidden.bs.modal",
          () => showModal("errorModal"),
          { once: true },
        );
        hideModal("createReviewModal");
      }
    });
  </script>
</body>
</html>
